name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            archive: zip
            artifact: LuASM-windows-x64
          - platform: linux-x64
            runner: ubuntu-22.04
            archive: tar.gz
            artifact: LuASM-linux-x64
          - platform: macos-universal
            runner: macos-14
            archive: tar.gz
            artifact: LuASM-macos-universal

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure macOS universal binary
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build Windows
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel 2

      - name: Build Linux and macOS
        if: runner.os != 'Windows'
        run: cmake --build build --config Release --parallel 2

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/LuASM.exe package/
          Copy-Item README.md package/
          if (Test-Path examples) { Copy-Item examples package/examples -Recurse }
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Package Linux and macOS
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp build/LuASM package/
          cp README.md package/
          if [ -d examples ]; then cp -R examples package/; fi
          tar -czf "${{ matrix.artifact }}.tar.gz" -C package .

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download packaged builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: LuASM ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
